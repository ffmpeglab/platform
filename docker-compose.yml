networks:
  isolated:
    internal: true   # No external connectivity
  public:   # Standard bridge network, created by Compose on docker compose up
services:
  ffmpeglab-platform:
    image: ffmpeglab/platform
    ports:
      - "${FFMPEGLAB_PLATFORM_PORT}:${FFMPEGLAB_PLATFORM_PORT}"
    environment:
      - SUPA_CONNECT_CLIENT_ID=${SUPA_CONNECT_CLIENT_ID}
      - SUPA_CONNECT_CLIENT_SECRET=${SUPA_CONNECT_CLIENT_SECRET}
      - VAULT_URL=${VAULT_URL}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - PLATFORM_HOST=${PLATFORM_HOST}
      - WEBAPP_HOST=${WEBAPP_HOST}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITLAB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITLAB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITLAB_APP_ID=${GITHUB_APP_ID}
      - GITLAB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET}
    networks:
      - isolated
      - public

  ffmpeglab-vault:
    image: hashicorp/vault
    ports:
      - "${VAULT_PORT}:1234"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:1234
    networks:
      - isolated
      - public